name: LuxRisk compatibility checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  small-checks:
    name: ${{ matrix.profile }} / Python 3.12
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: Linux x64
            runner: ubuntu-24.04
            architecture: x64
          - profile: Windows x64
            runner: windows-2022
            architecture: x64
          - profile: macOS Apple Silicon
            runner: macos-14
            architecture: arm64
          - profile: macOS Intel
            runner: macos-15-intel
            architecture: x64
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Install locked environment
        run: |
          python -m pip install poetry==2.5.1
          poetry sync --no-interaction
          poetry check --lock
          poetry run python -m pip check
          poetry run luxrisk doctor
      - name: Check contracts and small authored fixtures
        run: |
          poetry run ruff check luxrisk tests
          poetry run ruff format --check luxrisk tests
          poetry run mypy
          poetry run pytest -q
      - name: Build portable package
        run: |
          poetry build
          poetry run python -c "import glob, zipfile; z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); assert {'luxrisk/sql/schema.sql', 'luxrisk/static/index.html', 'luxrisk/static/app.js', 'luxrisk/static/style.css'} <= set(z.namelist())"
